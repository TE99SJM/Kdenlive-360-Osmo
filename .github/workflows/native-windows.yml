name: Native Windows editor
on:
  push:
    branches: [main]
    paths: ['native/**', 'windows/**', '.github/workflows/native-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Build and test the editor
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue) -or !(Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg-8.0.1.zip'
            $url = 'https://github.com/GyanD/codexffmpeg/releases/download/8.0.1/ffmpeg-8.0.1-essentials_build.zip'
            curl.exe --fail --location --retry 3 --output $zip $url
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'e2aaeaa0fdbc397d4794828086424d4aaa2102cef1fb6874f6ffd29c0b88b673') {
              throw 'Unexpected FFmpeg archive checksum.'
            }
            $toolsDir = Join-Path $env:RUNNER_TEMP 'osmo-test-tools'
            Expand-Archive $zip -DestinationPath $toolsDir
            $ffmpeg = Get-ChildItem $toolsDir -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
            if (!$ffmpeg -or !(Test-Path (Join-Path $ffmpeg.DirectoryName 'ffprobe.exe'))) { throw 'Missing FFmpeg test tools.' }
            $env:PATH = "$($ffmpeg.DirectoryName);$env:PATH"
          }
          cmake -S native -B build -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
      - name: Package the Windows add-on
        shell: pwsh
        run: |
          $app = "Osmo360-Windows-x64/app"
          New-Item $app -ItemType Directory -Force
          Copy-Item build/Release/osmo360-editor.exe $app
          windeployqt --release --no-translations --dir $app "$app/osmo360-editor.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$crt) { throw "The Microsoft app-local C++ runtime is missing." }
          Copy-Item "$($crt.FullName)/*.dll" $app
          Copy-Item LICENSE,LICENSE-PanoForge $app
          Copy-Item windows/Install-Kdenlive.cmd,README.md Osmo360-Windows-x64
          $env:QT_QPA_PLATFORM = "windows"
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          $process = Start-Process "$app/osmo360-editor.exe" -ArgumentList '--install','--data-dir','check-registration' -Wait -PassThru
          if ($process.ExitCode -or !(Select-String -Quiet -Path check-registration/clipjobsettings.rc -Pattern 'osmo360reframe=')) {
            throw "The packaged editor could not register its Kdenlive job."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Osmo360-Windows-x64
          path: Osmo360-Windows-x64/
